[project]
name = "riverkin-api"
version = "0.1.0"
description = "RiverKin backend — IEEE OneAquaHealth Global Hackathon 2026 (Track 5)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "fhir.resources>=7.1",
    "opencv-python-headless>=4.9",
    "imagehash>=4.3",
    "pillow>=10.3",
    "azure-storage-blob>=12.20",
    "azure-identity>=1.17",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear.
select = ["E", "F", "I", "UP", "B"]
# B008: calling Depends()/Query() in argument defaults is the FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
